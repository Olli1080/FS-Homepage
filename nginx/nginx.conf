
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # Protocol forwarding map
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Gzip Compression
    gzip  on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # HAProxy Real IP support
    set_real_ip_from  172.23.2.0/24; # Docker network subnet
    real_ip_header    X-Forwarded-For;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  www.fsmpi.uni-bayreuth.de;

        # Hardcode https redirect for performance and to prevent SSL downgrade hops
        return 301 https://fsmpi.uni-bayreuth.de$request_uri;
    }

    server {
        listen       80;
        server_name  fsmpi.uni-bayreuth.de;

        location /v1/ {
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header Host $http_host;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_pass_request_headers      on;
            proxy_pass http://strapi:1337/;
        }
		
        location / {
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass_request_headers      on;

            proxy_pass http://vuecms:5000;
        }
		
		# To allow special characters in headers
		ignore_invalid_headers off;
		# Allow any size file to be uploaded.
		# Set to a value such as 1000m; to restrict file size to a specific value
		client_max_body_size 0;
		# To disable buffering
		proxy_buffering off;
		
		location /testbucket {
				
			proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-NginX-Proxy true;
	        proxy_set_header X-Forwarded-Proto $scheme;
			#proxy_pass_request_headers	on; 

			proxy_connect_timeout 300;
			# Default is HTTP/1, keepalive is only enabled in HTTP/1.1
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			chunked_transfer_encoding off;

			proxy_pass http://192.168.178.41:9000; # If you are using docker-compose this would be the hostname i.e. minio
			# Health Check endpoint might go here. See https://www.nginx.com/resources/wiki/modules/healthcheck/
			# /minio/health/live;
		}

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

